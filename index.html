    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [isAdminAuthorized, setIsAdminAuthorized] = React.useState(false);

            // User Account States
            const [currentUser, setCurrentUser] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_current_user_v15');
                return saved ? JSON.parse(saved) : null;
            });
            const [authMode, setAuthMode] = React.useState('login');
            const [authEmail, setAuthEmail] = React.useState('');
            const [authPassword, setAuthPassword] = React.useState('');
            const [authName, setAuthName] = React.useState('');

            // Registered Users Database State
            const [usersList, setUsersList] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_users_db_v15');
                return saved ? JSON.parse(saved) : [];
            });

            // Admin Password State from localStorage (Default is '1234')
            const [adminPassword, setAdminPassword] = React.useState(() => {
                return localStorage.getItem('yichalal_admin_pass') || '1234';
            });

            // Check if URL has ?admin=true to prompt password
            React.useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === 'true') {
                    const password = prompt('እባክዎ የአስተዳዳሪ የይለፍ ቃል ያስገቡ:');
                    if (password === adminPassword) {
                        setIsAdminAuthorized(true);
                        setActiveTab('admin');
                    } else {
                        alert('የተሳሳተ የይለፍ ቃል!');
                        window.location.href = window.location.pathname;
                    }
                }
            }, [adminPassword]);

            const [books, setBooks] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_books_v15');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'ፍቅር እስከ መቃብር', author: 'በዓሉ ግርማ', price: 400, soldCount: 235, stock: 4, category: 'ልብ ወለድ', description: 'የእዮብ እና የብዙአንቱ ፍቅር እንዲሁም የማህበረሰቡን ገጽታ የሚያሳይ አንጋፋ ልብ ወለድ።', image: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600', isNew: false, isFeatured: true, freeReadContent: 'መግቢያ እና ምዕራፍ 1:\n\nበዕለተ እሁድ ከሰዓት በኋላ የነበረው ጸጥታ ከተማዋን ለብሶአት ነበር። እዮብ በመጽሐፉ ላይ አተኩሮ ሳለ የሰፈሩ ውሾች ይጮሁ ነበር...\n\n(ይህ ነጻ የማንበቢያ ማዕከል ናሙና ክፍል ነው፡፡ ሙሉውን ለማግኘት መጽሐፉን ይግዙ)።', reviews: [{ id: 1, user: 'አበበ', rating: 5, comment: 'በጣም ድንቅ መጽሐፍ ነው!' }] },
                    { id: 2, title: 'ኦሮማይ', author: 'በዓሉ ግርማ', price: 350, soldCount: 180, stock: 30, category: 'ልብ ወለድ', description: 'በፖለቲካዊ እና ማህበራዊ ዙሪያ ያተኮረ ተወዳጅ እና ታዋቂ መጽሐፍ።', image: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=600', isNew: true, isFeatured: true, freeReadContent: 'ምዕራፍ 1 - ጅምር:\n\nማህበራዊው እና ፖለቲካዊው ሂደት በወቅቱ ከፍተኛ ፍላጎት የፈጠረ ነበር። የድርጅቱ ስብሰባዎችም እንዲሁ በተለያዩ ውዝግቦች ታጅበው ነበር...\n\n(ይህ ነጻ የማንበቢያ ማዕከል ናሙና ክፍል ነው)።', reviews: [] },
                    { id: 3, title: 'ብርቅርቅታ', author: 'አለማየሁ ገላጋይ', price: 380, soldCount: 145, stock: 3, category: 'ልብ ወለድ', description: 'ዘመናዊ ማህበራዊ ህይወትን እና የሰዎችን ስነ-ልቦና በጥልቀት የሚዳስስ ድንቅ መጽሐፍ።', image: 'https://images.unsplash.com/photo-1495640388908-05fa85288e61?auto=format&fit=crop&q=80&w=600', isNew: true, isFeatured: true, freeReadContent: 'መቅድም:\n\nብርቅርቅታ የሰው ልጆችን ውስጣዊ ስሜት የሚፈትሽ እና አዲስ አተያይ የሚሰጥ ድንቅ የአጭር ማስታወሻዎች ስብስብ ነው።\n\n(ይህ ነጻ የማንበቢያ ማዕከል ናሙና ክፍል ነው)።', reviews: [] },
                    { id: 4, title: 'የኢትዮጵያ ታሪክ', author: 'ተክለጻድቅ መኩሪያ', price: 450, soldCount: 120, stock: 15, category: 'ታሪክ', description: 'ስለ ኢትዮጵያ ከጥንታዊ ዘመን እስከ አዲስ ታሪክ የሚዳስስ አጠቃላይ ድንቅ መጽሐፍ።', image: 'https://images.unsplash.com/photo-1461360370896-922624d12aa1?auto=format&fit=crop&q=80&w=600', isNew: false, isFeatured: false, freeReadContent: 'መግቢያ:\n\nየኢትዮጵያ ጥንታዊ ታሪክ ከክርስቶስ ልደት በፊት የነበሩ ስልጣኔዎችን እና የንግድ መስመሮችን የሚያሳይ ነው።\n\n(ይህ ነጻ የማንበቢያ ማዕከል ናሙና ክፍል ነው)።', reviews: [] }
                ];
            });

            // News & Announcements States
            const [newsList, setNewsList] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_news_v15');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'እንኳን ወደ ይቻላል መጽሐፍት መደብር በደህና መጡ!', content: 'አዳዲስ መጻሕፍት ገብተዋል እንዲሁም የ10% ቅናሽ ኮድ (YICHALAL10) መጠቀም ይችላሉ።', category: 'አጠቃላይ', date: '2026-07-27' }
                ];
            });
            const [newsTitleInput, setNewsTitleInput] = React.useState('');
            const [newsContentInput, setNewsContentInput] = React.useState('');
            const [newsCategory, setNewsCategory] = React.useState('አጠቃላይ');
            const [selectedNewsCategory, setSelectedNewsCategory] = React.useState('ሁሉም');

            const [cart, setCart] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_cart_v15');
                return saved ? JSON.parse(saved) : [];
            });

            const [wishlist, setWishlist] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_wish_v15');
                return saved ? JSON.parse(saved) : [];
            });

            const [orders, setOrders] = React.useState(() => {
                const saved = localStorage.getItem('yichalal_orders_v15');
                return saved ? JSON.parse(saved) : [];
            });

            // Admin Form States
            const [title, setTitle] = React.useState('');
            const [author, setAuthor] = React.useState('');
            const [price, setPrice] = React.useState('');
            const [soldCount, setSoldCount] = React.useState('');
            const [stock, setStock] = React.useState('');
            const [category, setCategory] = React.useState('ልብ ወለድ');
            const [description, setDescription] = React.useState('');
            const [image, setImage] = React.useState('');
            const [freeReadContent, setFreeReadContent] = React.useState('');
            const [isNewBook, setIsNewBook] = React.useState(false);
            const [isFeaturedBook, setIsFeaturedBook] = React.useState(false);
            const [editId, setEditId] = React.useState(null);

            // Filter & Search
            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCategory, setSelectedCategory] = React.useState('ሁሉም');

            // Free Reading Room Active Book State
            const [activeReadBook, setActiveReadBook] = React.useState(null);

            // Customer Info & Payment & Promo
            const [customerName, setCustomerName] = React.useState('');
            const [customerPhone, setCustomerPhone] = React.useState('');
            const [customerAddress, setCustomerAddress] = React.useState('');
            const [paymentMethod, setPaymentMethod] = React.useState('ንግድ ባንክ');
            const [transactionId, setTransactionId] = React.useState('');
            const [promoCode, setPromoCode] = React.useState('');
            const [discount, setDiscount] = React.useState(0);

            // Review Input States
            const [reviewRating, setReviewRating] = React.useState(5);
            const [reviewComment, setReviewComment] = React.useState('');

            // Feedback / Complaint States
            const [fbName, setFbName] = React.useState('');
            const [fbType, setFbType] = React.useState('አስተያየት');
            const [fbMessage, setFbMessage] = React.useState('');

            const [selectedBook, setSelectedBook] = React.useState(null);
            const [notification, setNotification] = React.useState('');

            // Slider Index States
            const [currentHeroSlide, setCurrentHeroSlide] = React.useState(0);
            
            const heroSlides = [
                {
                    title: 'ልዩ የጽሐፍ ስራዎች ማደሪያ',
                    subtitle: 'ጥራትና ጥንቁቅ የፈጠራ ውጤቶችን ከኛ ጋር ይለማመዱ።',
                    bgImg: 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&q=80&w=1600'
                },
                {
                    title: 'አዳዲስ እና ምርጥ መጻሕፍት',
                    subtitle: 'እውቀትዎን የሚያዳብሩ ምርጥ መጻሕፍትን በተመጣጣኝ ዋጋ ያግኙ።',
                    bgImg: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=1600'
                }
            ];

            React.useEffect(() => {
                const heroTimer = setInterval(() => {
                    setCurrentHeroSlide(prev => (prev + 1) % heroSlides.length);
                }, 6000);
                return () => clearInterval(heroTimer);
            }, [heroSlides.length]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_books_v15', JSON.stringify(books));
            }, [books]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_news_v15', JSON.stringify(newsList));
            }, [newsList]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_cart_v15', JSON.stringify(cart));
            }, [cart]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_wish_v15', JSON.stringify(wishlist));
            }, [wishlist]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_orders_v15', JSON.stringify(orders));
            }, [orders]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_current_user_v15', JSON.stringify(currentUser));
            }, [currentUser]);

            React.useEffect(() => {
                localStorage.setItem('yichalal_users_db_v15', JSON.stringify(usersList));
            }, [usersList]);

            const notify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            // Authentication Handlers
            const handleRegister = (e) => {
                e.preventDefault();
                if (!authEmail || !authPassword || !authName) {
                    alert('እባክዎ ሁሉንም መስኮች ይሙሉ!');
                    return;
                }
                const existing = usersList.find(u => u.email === authEmail);
                if (existing) {
                    alert('ይህ ኢሜይል ቀደም ሲል ተመዝግቧል!');
                    return;
                }
                const newUser = { id: Date.now(), name: authName, email: authEmail, password: authPassword };
                setUsersList([...usersList, newUser]);
                setCurrentUser(newUser);
                setCustomerName(authName);
                notify('አካውንትዎ በተሳካ ሁኔታ ተፈጥሯል! 🎉');
                setActiveTab('home');
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const found = usersList.find(u => u.email === authEmail && u.password === authPassword);
                if (found) {
                    setCurrentUser(found);
                    setCustomerName(found.name);
                    notify(`እንኳን ደህና መጡ, ${found.name}! 👋`);
                    setActiveTab('home');
                } else {
                    alert('የተሳሳተ ኢሜይል ወይም የይለፍ ቃል!');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                notify('ከአካውንትዎ ወጥተዋል!');
                setActiveTab('account');
            };

            const applyPromo = () => {
                if (promoCode.trim().toUpperCase() === 'YICHALAL10') {
                    setDiscount(0.1);
                    notify('የ 10% ቅናሽ ኮድ ተሰርቷል! 🎉');
                } else {
                    setDiscount(0);
                    notify('የተሳሳተ የቅናሽ ኮድ!');
                }
            };

            const handleAdminSubmit = (e) => {
                e.preventDefault();
                const sales = parseInt(soldCount) || 0;
                const availableStock = parseInt(stock) || 0;
                const defaultImg = image.trim() || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600';
                const defaultRead = freeReadContent.trim() || 'ይህ የናሙና ነጻ የማንበቢያ ክፍል ነው። ሙሉውን መጽሐፍ ለመግዛት በመደብሩ ገጽ ያዙ።';

                if (editId) {
                    setBooks(books.map(b => b.id === editId ? {
                        ...b, title, author, price: parseFloat(price), soldCount: sales, stock: availableStock, category, description, image: defaultImg, freeReadContent: defaultRead, isNew: isNewBook, isFeatured: isFeaturedBook
                    } : b));
                    setEditId(null);
                    notify('መጽሐፉ ተሻሽሏል!');
                } else {
                    const newBook = {
                        id: Date.now(), title, author, price: parseFloat(price), soldCount: sales, stock: availableStock, category, description: description || 'ጥራት ያለው መጽሐፍ።', image: defaultImg, freeReadContent: defaultRead, isNew: isNewBook, isFeatured: isFeaturedBook, reviews: []
                    };
                    setBooks([...books, newBook]);
                    notify('አዲስ መጽሐፍ ተመዝግቧል!');
                }
                setTitle(''); setAuthor(''); setPrice(''); setSoldCount(''); setStock(''); setDescription(''); setImage(''); setFreeReadContent(''); setIsNewBook(false); setIsFeaturedBook(false);
            };

            const handleNewsSubmit = (e) => {
                e.preventDefault();
                if (!newsTitleInput.trim() || !newsContentInput.trim()) return;
                const newNewsItem = {
                    id: Date.now(),
                    title: newsTitleInput,
                    content: newsContentInput,
                    category: newsCategory,
                    date: new Date().toISOString().split('T')[0]
                };
                setNewsList([newNewsItem, ...newsList]);
                setNewsTitleInput('');
                setNewsContentInput('');
                notify('አዲስ ዜና በተሳካ ሁኔታ ተለጥፏል! 📰');
            };

            const deleteNews = (id) => {
                setNewsList(newsList.filter(n => n.id !== id));
                notify('ዜናው ተሰርዟል!');
            };

            const addToCart = (book) => {
                if (book.stock <= 0) {
                    notify('ይቅርታ! ይህ መጽሐፍ አልቋል (Out of Stock)');
                    return;
                }
                const exist = cart.find(item => item.id === book.id);
                if (exist) {
                    if (exist.quantity >= book.stock) {
                        notify('ከእጃችን ላይ ያለው ክምችት አልቋል!');
                        return;
                    }
                    setCart(cart.map(i => i.id === book.id ? { ...i, quantity: i.quantity + 1 } : i));
                } else {
                    setCart([...cart, { ...book, quantity: 1 }]);
                }
                notify(`"${book.title}" ወደ ጋሪ ተጨምሯል! 🛒`);
            };

            const updateQty = (id, delta) => {
                setCart(cart.map(item => {
                    if (item.id === id) {
                        const bookInfo = books.find(b => b.id === id);
                        const newQ = item.quantity + delta;
                        if (delta > 0 && bookInfo && newQ > bookInfo.stock) {
                            notify('ከክምችት በላይ መውሰድ አይቻልም!');
                            return item;
                        }
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const toggleWishlist = (book) => {
                if (wishlist.some(i => i.id === book.id)) {
                    setWishlist(wishlist.filter(i => i.id !== book.id));
                    notify('ከተወዳጆችዎ ወጥቷል።');
                } else {
                    setWishlist([...wishlist, book]);
                    notify('ወደ ተወዳጆችዎ ተጨምሯል! ❤️');
                }
            };

            const handleAddReview = (e, bookId) => {
                e.preventDefault();
                if (!reviewComment.trim()) return;

                                    <textarea placeholder="ለነጻ ንባብ ክፍል የሚሆን የይዘት/ምዕራፍ ናሙና ጽሑፍ" rows="4" value={freeReadContent} onChange={e => setFreeReadContent(e.target.value)} className="border rounded-xl p-3 outline-none md:col-span-2 bg-amber-50/50"></textarea>

                                    <div className="md:col-span-2 flex gap-2">
                                        <button type="submit" className="bg-indigo-600 text-white font-bold py-2.5 px-6 rounded-xl text-xs">
                                            {editId ? 'ለውጦችን መዝግብ' : 'መጽሐፍ መዝግብ'}
                                        </button>
                                    </div>
                                </form>
                            </div>

                            {/* Books List Table with Low Stock Alerts */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm space-y-4">
                                <h3 className="font-bold text-base text-gray-900 border-b pb-2">📚 ነባር መጻሕፍት ዝርዝር (የክምችት ሁኔታ)</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-gray-100 text-gray-700 uppercase">
                                            <tr>
                                                <th className="p-3">መጽሐፍ</th>
                                                <th className="p-3">ደራሲ</th>
                                                <th className="p-3">ዋጋ</th>
                                                <th className="p-3">ክምችት (Stock)</th>
                                                <th className="p-3 text-center">እርምጃ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {books.map(b => (
                                                <tr key={b.id} className="hover:bg-gray-50">
                                                    <td className="p-3 flex items-center space-x-3">
                                                        <img src={b.image} alt={b.title} className="w-9 h-9 object-cover rounded-lg" />
                                                        <span className="font-bold">{b.title}</span>
                                                    </td>
                                                    <td className="p-3">{b.author}</td>
                                                    <td className="p-3 text-emerald-600 font-bold">{b.price} ብር</td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-1 rounded-lg font-bold ${b.stock <= 5 ? 'bg-red-100 text-red-700 animate-pulse' : 'bg-green-100 text-green-700'}`}>
                                                            {b.stock} ቅጂዎች {b.stock <= 5 ? '⚠️ (አልቋል/ሊያልቅ ነው)' : ''}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-center space-x-2">
                                                        <button onClick={() => { setEditId(b.id); setTitle(b.title); setAuthor(b.author); setPrice(b.price); setStock(b.stock); setCategory(b.category); setDescription(b.description); setImage(b.image); setFreeReadContent(b.freeReadContent || ''); window.scrollTo({ top: 400, behavior: 'smooth' }); }} className="bg-indigo-50 text-indigo-600 font-bold px-3 py-1.5 rounded-xl">አስተካክል</button>
                                                        <button onClick={() => { setBooks(books.filter(x => x.id !== b.id)); notify('መጽሐፉ ተሰርዟል!'); }} className="bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-xl">ሰርዝ</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t mt-16">
                        <div className="max-w-6xl mx-auto px-6 py-6 text-center text-xs text-gray-500 space-y-2">
                            <p>© 2026 ይቻላል የመጽሐፍት መደብር። መብቱ በህግ የተጠበቀ ነው።</p>
                            <p className="font-semibold text-emerald-700">ለተሻለ እውቀት ማንበቤን እቀጥላለሁ!</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
