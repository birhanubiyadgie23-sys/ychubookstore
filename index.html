<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ይቻላል የመጽሐፍት መደብር | Yichalal Bookstore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        // እዚህጋ የራስዎን የ Supabase ዩአርኤል እና ኪ (Key) ብቻ ያስገቡ
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [books, setBooks] = React.useState([]);
            const [cart, setCart] = React.useState([]);
            const [view, setView] = React.useState('home');
            const [search, setSearch] = React.useState('');

            React.useEffect(() => {
                fetchBooks();
            }, []);

            const fetchBooks = async () => {
                const { data, error } = await supabase.from('books').select('*');
                if (data) setBooks(data);
                if (error) console.error(error);
            };

            const addToCart = (book) => {
                setCart([...cart, book]);
                alert('መጽሐፉ ወደ ግዢ ሰንጠረዥ ተጨምሯል!');
            };

            const filteredBooks = books.filter(b => b.title.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-indigo-900 text-white p-4 flex justify-between items-center shadow-md">
                        <h1 className="text-xl font-bold cursor-pointer" onClick={() => setView('home')}>ይቻላል የመጽሐፍት መደብር</h1>
                        <div className="space-x-4">
                            <button onClick={() => setView('home')} className="hover:text-yellow-400">መነሻ</button>
                            <button onClick={() => setView('cart')} className="hover:text-yellow-400">ግዢ ({cart.length})</button>
                        </div>
                    </header>

                    <main className="container mx-auto p-4 flex-grow">
                        {view === 'home' ? (
                            <div>
                                <input 
                                    type="text" 
                                    placeholder="መጻሕፍትን ይፈልጉ..." 
                                    value={search} 
                                    onChange={(e) => setSearch(e.target.value)}
                                    className="w-full p-3 border rounded-lg mb-6 outline-none shadow-sm"
                                />
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                                    {filteredBooks.map(book => (
                                        <div key={book.id} className="bg-white p-4 rounded-xl shadow border flex flex-col justify-between">
                                            <div>
                                                <img src={book.image || 'https://via.placeholder.com/150'} alt="" className="h-40 w-full object-cover rounded mb-2"/>
                                                <h3 className="font-bold text-lg">{book.title}</h3>
                                                <p className="text-sm text-gray-500">{book.author}</p>
                                                <p className="text-indigo-600 font-bold mt-2">{book.price} ብር</p>
                                            </div>
                                            <button onClick={() => addToCart(book)} className="mt-4 bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">ግዛ / አስገባ</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-xl mx-auto bg-white p-6 rounded-xl shadow border">
                                <h2 className="text-2xl font-bold mb-4">የግዢ ሰንጠረዥ</h2>
                                {cart.length === 0 ? <p className="text-gray-500">ባዶ ነው።</p> : (
                                    cart.map((item, idx) => (
                                        <div key={idx} className="flex justify-between border-b py-2">
                                            <span>{item.title}</span>
                                            <span className="font-bold">{item.price} ብር</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
