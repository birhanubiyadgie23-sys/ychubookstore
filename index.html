<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ብርሃኑ መጽሐፍት መደብር | Birhanu Bookstore</title>
    <!-- የጉግል ፊደላት (Google Fonts) ለግዕዝ እና ላቲን ውበት -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e3d59;
            --secondary: #17b978;
            --accent: #ff6e40;
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Serif Ethiopic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* setHeader & Navigation */
        header {
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .cart-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .cart-btn:hover {
            background: var(--secondary);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary), #112233);
            color: var(--white);
            padding: 4rem 2rem;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 2rem;
            opacity: 0.9;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            background: var(--white);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .search-box input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .search-box button {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 0 1.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .book-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .book-img-container {
            height: 220px;
            background: #e1e8ed;
            overflow: hidden;
            position: relative;
        }

        .book-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .book-card:hover .book-img-container img {
            transform: scale(1.05);
        }

        .book-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .book-category {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .book-author {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .book-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .buy-btn {
            background: var(--secondary);
            color: var(--white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .buy-btn:hover {
            background: #109c62;
        }

        /* Cart Sidebar / Drawer */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: var(--white);
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            z-index: 1100;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            background: var(--primary);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .cart-footer {
            padding: 1.5rem;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        /* Footer */
        footer {
            background: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .nav-links { display: none; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <a href="#" class="logo">📚 ብርሃኑ <span>መደብር</span></a>
            <ul class="nav-links">
                <li><a href="#">ዋና ገጽ</a></li>
                <li><a href="#books-section">መጽሐፍት</a></li>
                <li><a href="#news">ዜናዎች</a></li>
                <li><a href="#announcements">ማስታወቂያ</a></li>
            </ul>
            <button class="cart-btn" onclick="toggleCartSidebar()">
                🛒 ቅርጫት (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>እውቀት ብርሃን ነው</h1>
        <p>የተመረጡ ጥንታዊና ዘመናዊ መጽሐፍትን በቀላሉ ይዘዙ፤ እኛም ያሉበት እናደርሳለን።</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="የመጽሐፍ ወይም ደራሲ ስም ይፈልጉ..." oninput="filterBooks()">
            <button>ፈልግ</button>
        </div>
    </section>

    <!-- Main Content: Books -->
    <div class="container" id="books-section">
        <div class="section-title">
            <span>የመጽሐፍት መደርደሪያ</span>
        </div>
        <div class="books-grid" id="booksGrid">
            <!-- ጃቫስክሪፕት በዳታቤዝ ያሉትን መጽሐፍት እዚህ ይጭናል -->
            <p style="text-align: center; grid-column: 1 / -1; color: #777;">መጽሐፍት በመጫን ላይ...</p>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>የእርስዎ የገበያ ቅርጫት</h3>
            <button class="close-cart" onclick="toggleCartSidebar()">✕</button>
        </div>
        <div class="cart-items" id="sidebar-items">
            <p style="color: #888; text-align: center;">ቅርጫቱ ባዶ ነው።</p>
        </div>
        <div class="cart-footer">
            <div class="total-section">
                <span>ድምር:</span>
                <span><span id="sidebar-total-price">0</span> ብር</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">ግዢውን ጨርስ</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ብርሃኑ መጽሐፍት መደብር። መብቱ በህግ የተጠበቀ ነው።</p>
    </footer>

    <!-- JavaScript ሎጂክ -->
    <script>
        // የሱፓቤዝ (Supabase) ማዋቀሪያ (እባክዎ ትክክለኛውን ዩአርኤል እና ኪይ ያስገቡ)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cart = [];
        let allBooks = [];

        async function initApp() {
            await fetchBooks();
        }

        async function fetchBooks() {
            const { data, error } = await dbClient.from('books').select('*');
            if (error) {
                console.error('መጽሐፍትን ማምጣት አልተቻለም:', error.message);
                document.getElementById('booksGrid').innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">መረጃውን መጫን አልተቻለም። እባክዎ እንደገና ይሞክሩ።</p>';
                return;
            }
            allBooks = data || [];
            displayBooks(allBooks);
        }

        function displayBooks(books) {
            const grid = document.getElementById('booksGrid');
            if (books.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #777;">ምንም መጽሐፍ አልተገኘም።</p>';
                return;
            }

            grid.innerHTML = books.map(book => `
                <div class="book-card">
                    <div class="book-img-container">
                        <img src="${book.image_url || 'https://via.placeholder.com/300x220?text=No+Image'}" alt="${book.title}">
                    </div>
                    <div class="book-info">
                        <span class="book-category">${book.category || 'አጠቃላይ'}</span>
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">ከአዘጋጅ/ደራሲ: ${book.author || 'ያልታወቀ'}</p>
                        <div class="book-footer">
                            <span class="book-price">${book.price} ብር</span>
                            <button class="buy-btn" onclick='addToCart(${JSON.stringify(book)})'>ይግዙ</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBooks.filter(book => 
                book.title.toLowerCase().includes(query) || 
                (book.author && book.author.toLowerCase().includes(query))
            );
            displayBooks(filtered);
        }

        function toggleCartSidebar() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addToCart(book) {
            const existing = cart.find(item => item.id === book.id);
            if (existing) {
                existing.quantity = (existing.quantity || 1) + 1;
            } else {
                cart.push({ ...book, quantity: 1 });
            }
            updateCartUI();
            toggleCartSidebar();
        }

        function removeFromCart(bookId) {
            cart = cart.filter(item => item.id !== bookId);
            updateCartUI();
        }

        function updateCartUI() {
            const countSpan = document.getElementById('cart-count');
            const sidebarItems = document.getElementById('sidebar-items');
            const sidebarTotalPrice = document.getElementById('sidebar-total-price');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                sidebarItems.innerHTML = '<p style="color: #888; text-align: center;">ቅርጫቱ ባዶ ነው።</p>';
            } else {
                sidebarItems.innerHTML = '';
                cart.forEach(item => {
                    const qty = item.quantity || 1;
                    totalCount += qty;
                    totalPrice += item.price * qty;

                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `
                        <span><b>${item.title}</b> (${qty})</span>
                        <span>${item.price * qty} ብር <button onclick="removeFromCart('${item.id}')" style="background:none; border:none; color:red; cursor:pointer; margin-left: 8px; font-weight:bold;">✕</button></span>
                    `;
                    sidebarItems.appendChild(row);
                });
            }

            countSpan.innerText = totalCount;
            sidebarTotalPrice.innerText = totalPrice;
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert('ቅርጫቱ ባዶ ነው! እባክዎ መጀመሪያ መጽሐፍ ይምረጡ።');
                return;
            }
            let totalPrice = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
            alert(`ጠቅላላ ዋጋ: ${totalPrice} ብር። ግዢዎን ለመፈጸም እናመሰግናለን!`);
            cart = [];
            updateCartUI();
            toggleCartSidebar();
        }

        window.onload = initApp;
    </script>
</body>
</html>
